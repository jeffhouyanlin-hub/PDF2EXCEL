<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:13px;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh}

/* Controls */
#ctrl{display:flex;align-items:center;gap:8px;padding:6px 12px;background:#f8f9fa;border-bottom:1px solid #dee2e6;flex-shrink:0}
#ctrl button{padding:4px 12px;border:1px solid #ced4da;border-radius:4px;background:#fff;cursor:pointer;font-size:15px;line-height:1.2}
#ctrl button:hover{background:#e9ecef}
#ctrl button.on{background:#0d6efd;color:#fff;border-color:#0d6efd}
.sep{color:#ccc}.clbl{font-size:11px;color:#888}
#spd{width:100px;vertical-align:middle}
#spd-v{font-size:11px;color:#666;min-width:34px;display:inline-block}
#ctr{margin-left:auto;font-size:12px;color:#555;font-weight:500}

/* Panels — PDF 60% left, Excel 40% right */
#panels{display:flex;flex:1;overflow:hidden}
.pnl{display:flex;flex-direction:column;overflow:hidden}
#pp{flex:6}
#ep{flex:4;border-left:2px solid #dee2e6}
.pnl-hd{padding:5px 12px;background:#e9ecef;font-weight:600;font-size:12px;color:#495057;border-bottom:1px solid #dee2e6;flex-shrink:0}
.pnl-vp{flex:1;position:relative;overflow:hidden}
.pnl-body{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto}

/* Excel table */
.seg-hd{padding:5px 10px;background:#f0f0f0;font-weight:600;font-size:11px;color:#6c757d;border-top:1px solid #e0e0e0}
.et{width:100%;border-collapse:collapse}
.et th{padding:4px 8px;text-align:left;font-size:11px;color:#6c757d;border-bottom:2px solid #dee2e6;background:#f8f9fa;white-space:nowrap;position:sticky;top:0;z-index:2}
.et td{padding:4px 8px;white-space:nowrap;border-bottom:1px solid #f0f0f0;font-size:12px}

/* Color box — transparent overlay, no data display */
.cbox{position:absolute;left:0;right:0;pointer-events:none;z-index:10;display:none;transition:top .25s ease}
.cbox-hd{display:none}
.cbox-row{border:2.5px dashed;min-height:24px}
.cbox.grn .cbox-row{border-color:rgba(34,197,94,.8);background:rgba(34,197,94,.12)}
.cbox.red .cbox-row{border-color:rgba(239,68,68,.8);background:rgba(239,68,68,.12)}

/* Status */
#sts{padding:5px 12px;background:#f8f9fa;border-top:1px solid #dee2e6;font-size:12px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.bdg{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;margin-right:4px}
.bdg.g{background:#d1fae5;color:#065f46}
.bdg.r{background:#fee2e2;color:#991b1b}
.bdg.y{background:#fef3c7;color:#92400e}
.lyr{display:inline-flex;align-items:center;gap:3px;margin-right:10px;font-size:11px;padding:2px 8px;border-radius:4px;border:1px solid #dee2e6;background:#fff}
.lyr.pass{border-color:#86efac;background:#f0fdf4}
.lyr.fail{border-color:#fca5a5;background:#fef2f2}
.lyr.skip{border-color:#fcd34d;background:#fffbeb}
</style></head><body>
<div id="app">
<div id="ctrl">
<button id="bp" title="上一条/Prev">&#9664;</button>
<button id="bpl" title="播放/Play">&#9654;</button>
<button id="bn" title="下一条/Next">&#9654;|</button>
<button id="br" title="重置/Reset">&#8634;</button>
<span class="sep">|</span><span class="clbl">速度/Speed:</span>
<input type="range" id="spd" min="200" max="3000" step="100" value="1000">
<span id="spd-v">1.0s</span>
<span id="ctr"></span>
</div>
<div id="panels">
<div class="pnl" id="pp">
<div class="pnl-hd">&#128196; PDF 原件 / PDF Original</div>
<div class="pnl-vp">
<div class="pnl-body" id="ps"><iframe id="pif" style="width:100%;height:100%;border:none"></iframe></div>
<div class="cbox grn" id="pcb"><div class="cbox-row" id="pcr"></div></div>
</div>
</div>
<div class="pnl" id="ep">
<div class="pnl-hd">&#128202; Excel 数据 / Excel Data</div>
<div class="pnl-vp">
<div class="pnl-body" id="es"></div>
<div class="cbox grn" id="ecb"><div class="cbox-row" id="ecr"></div></div>
</div>
</div>
</div>
<div id="sts"><span id="stt"></span><span id="sts2"></span></div>
</div>
<script>
/* === Data (injected by Python) === */
var D = "__PAYLOAD__";
var PB = '__PDF_B64__';

/* === Helpers === */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* === Render Excel table === */
(function(){
var el=document.getElementById('es'),h='',ps=-1,i,j,c,r,s;
for(i=0;i<D.rows.length;i++){
  r=D.rows[i]; s=D.segments[r.seg];
  if(r.seg!==ps){
    if(ps>=0) h+='</tbody></table>';
    ps=r.seg;
    h+='<div class="seg-hd">\ud83d\udcd1 '+esc(s.sheet)+'</div>';
    h+='<table class="et"><thead><tr>';
    for(j=0;j<s.columns.length;j++) h+='<th>'+esc(s.columns[j])+'</th>';
    h+='</tr></thead><tbody>';
  }
  h+='<tr data-i="'+i+'">';
  for(c=0;c<r.ev.length;c++) h+='<td>'+esc(r.ev[c])+'</td>';
  h+='</tr>';
}
if(ps>=0) h+='</tbody></table>';
el.innerHTML=h;
})();

/* === Load PDF in iframe === */
if(PB){document.getElementById('pif').src='data:application/pdf;base64,'+PB+'#navpanes=0&toolbar=1&view=FitH';}

/* === Status bar === */
(function(){
var stt=document.getElementById('stt'), sts2=document.getElementById('sts2');
var lyrHtml='';
if(D.layers && D.layers.length>0){
  for(var li=0;li<D.layers.length;li++){
    var ly=D.layers[li];
    var cls=ly.skipped?'skip':(ly.passed?'pass':'fail');
    var icon=ly.skipped?'\u23ed':(ly.passed?'\u2713':'\u2717');
    var extra=(!ly.passed&&!ly.skipped&&ly.mismatched>0)?' ('+ly.mismatched+')':'';
    lyrHtml+='<span class="lyr '+cls+'">'+icon+' '+esc(ly.label)+extra+'</span>';
  }
}
sts2.innerHTML=lyrHtml+
  '<span class="bdg g">\u2713 '+D.matched+'</span>'+
  '<span class="bdg r">\u2717 '+D.mismatched+'</span>'+
  ' \u5171/Total: '+D.total;
})();
document.getElementById('ctr').textContent='0 / '+D.total;
document.getElementById('stt').textContent='\u5c31\u7eea / Ready';

/* === Speed slider === */
var spdEl=document.getElementById('spd'),svEl=document.getElementById('spd-v');
spdEl.oninput=function(){svEl.textContent=(this.value/1000).toFixed(1)+'s';};

/* ================================================================
   P3: Core stepping / scrolling / sync / header refresh logic
   ================================================================ */
(function(){
var curIdx=-1, playing=false, timer=null;
var esEl=document.getElementById('es'), psEl=document.getElementById('ps');
var ecb=document.getElementById('ecb'), pcb=document.getElementById('pcb');
var ecr=document.getElementById('ecr'), pcr=document.getElementById('pcr');
var ctrEl=document.getElementById('ctr'), sttEl=document.getElementById('stt');
var prevSeg=-1;

/* Expose current index for P4 */
window.getCurrentIdx=function(){return curIdx;};

/* --- Mechanism C: Compare & color (overlay only, no data) --- */
function applyColor(idx){
  var r=D.rows[idx], cls=r.ok?'grn':'red';
  ecb.className='cbox '+cls; pcb.className='cbox '+cls;
}

/* --- Mechanism B: Segment change detection (headers in table are sticky) --- */
function refreshHeaders(idx){
  var r=D.rows[idx];
  if(r.seg!==prevSeg) prevSeg=r.seg;
}

/* --- Helper: cumulative offset from element to container --- */
function getOffsetTo(el,container){
  var top=0;
  while(el&&el!==container){top+=el.offsetTop;el=el.offsetParent;}
  return top;
}

/* --- Mechanism A: Position & scroll (Rule 4) --- */
function positionExcel(idx){
  var row=esEl.querySelector('tr[data-i="'+idx+'"]');
  if(!row) return;
  /* Rule 2: Excel color box height = Excel row height */
  ecr.style.height=row.offsetHeight+'px';
  var vpH=esEl.clientHeight;
  var centerY=vpH/2;
  /* Cumulative offset relative to scroll container (.pnl-body) */
  var rowTop=getOffsetTo(row,esEl);

  /* Step 1: set scroll position */
  if(rowTop<=centerY){
    esEl.scrollTop=0;               /* Phase A: no scroll */
  } else {
    esEl.scrollTop=rowTop-centerY;  /* Phase B: scroll row to center */
  }

  /* Step 2: measure actual visual position after scroll (forces reflow) */
  var vpRect=esEl.parentNode.getBoundingClientRect();
  var rowRect=row.getBoundingClientRect();

  /* Step 3: place color box at measured position */
  ecb.style.top=(rowRect.top-vpRect.top)+'px';
  ecb.style.display='block';
}

function syncPdf(){
  /* Rule 3: PDF box top = Excel box top (forced alignment) */
  var exTop=parseInt(ecb.style.top)||0;
  pcb.style.top=exTop+'px';
  /* Fallback height: match Excel box when PDF.js not yet loaded */
  pcr.style.height=ecr.style.height;
  pcb.style.display='block';
  /* Use precise PDF.js positioning if available (P4) */
  if(window.syncPdfPrecise) window.syncPdfPrecise(curIdx);
}

/* --- Step to row --- */
function stepTo(idx){
  if(idx<0||idx>=D.total) return;
  /* Unhighlight previous */
  if(curIdx>=0){
    var prev=esEl.querySelector('tr[data-i="'+curIdx+'"]');
    if(prev) prev.style.background='';
  }
  curIdx=idx;
  /* Highlight current row in table */
  var cur=esEl.querySelector('tr[data-i="'+idx+'"]');
  if(cur) cur.style.background='rgba(255,253,231,.6)';

  refreshHeaders(idx);
  applyColor(idx);
  positionExcel(idx);
  syncPdf();

  /* Update counter & status */
  ctrEl.textContent=(idx+1)+' / '+D.total;
  var r=D.rows[idx], s=D.segments[r.seg];
  sttEl.textContent=(r.ok?'\u2714 ':'\u2718 ')+s.sheet+' \u2014 '+(idx+1);
}

/* Expose triggerSync for P4 to re-sync after PDF.js loads */
window.triggerSync=function(){
  if(curIdx>=0) syncPdf();
};

/* --- Playback --- */
function play(){
  if(playing) return;
  playing=true;
  document.getElementById('bpl').classList.add('on');
  document.getElementById('bpl').innerHTML='&#10074;&#10074;';
  advance();
}
function pause(){
  playing=false;
  if(timer){clearTimeout(timer);timer=null;}
  document.getElementById('bpl').classList.remove('on');
  document.getElementById('bpl').innerHTML='&#9654;';
}
function advance(){
  if(!playing) return;
  var next=curIdx+1;
  if(next>=D.total){
    pause();
    sttEl.textContent='\u2705 \u64ad\u653e\u5b8c\u6bd5 / Playback finished';
    return;
  }
  stepTo(next);
  timer=setTimeout(advance, parseInt(spdEl.value));
}

/* --- Button handlers --- */
document.getElementById('bp').onclick=function(){pause();if(curIdx>0)stepTo(curIdx-1);};
document.getElementById('bpl').onclick=function(){playing?pause():play();};
document.getElementById('bn').onclick=function(){pause();if(curIdx<D.total-1)stepTo(curIdx+1);};
document.getElementById('br').onclick=function(){pause();prevSeg=-1;stepTo(0);};

/* --- Keyboard shortcuts --- */
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();pause();if(curIdx<D.total-1)stepTo(curIdx+1);}
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();pause();if(curIdx>0)stepTo(curIdx-1);}
  if(e.key===' '){e.preventDefault();playing?pause():play();}
  if(e.key==='Home'){e.preventDefault();pause();prevSeg=-1;stepTo(0);}
  if(e.key==='End'){e.preventDefault();pause();stepTo(D.total-1);}
});

/* --- Start at row 0 --- */
if(D.total>0) stepTo(0);
})();

/* ================================================================
   P4: PDF.js rendering with precise coordinate mapping
   ================================================================ */
(function(){
var psEl=document.getElementById('ps');
var pcb=document.getElementById('pcb');
var pif=document.getElementById('pif');
var PDF_SCALE=1.5;
var pageCanvases=[]; /* {canvas, offsetTop, pageHeight, pdfHeight} */
var pdfReady=false;

if(!PB){return;} /* No PDF data */

/* Remove iframe, replace with canvas container */
pif.style.display='none';
var pdfWrap=document.createElement('div');
pdfWrap.id='pdf-wrap';
pdfWrap.style.cssText='width:100%;';
psEl.appendChild(pdfWrap);

/* Load PDF.js from CDN */
var script=document.createElement('script');
script.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
script.onload=function(){
  var pdfjsLib=window['pdfjs-dist/build/pdf'];
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  /* Decode base64 to Uint8Array */
  var raw=atob(PB), arr=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++) arr[i]=raw.charCodeAt(i);

  pdfjsLib.getDocument({data:arr}).promise.then(function(pdf){
    var numPages=pdf.numPages;
    var chain=Promise.resolve();
    for(var p=1;p<=numPages;p++){
      (function(pageNum){
        chain=chain.then(function(){
          return pdf.getPage(pageNum).then(function(page){
            var vp=page.getViewport({scale:PDF_SCALE});
            var canvas=document.createElement('canvas');
            canvas.width=vp.width;
            canvas.height=vp.height;
            canvas.style.cssText='width:100%;display:block;border-bottom:1px solid #eee;';
            pdfWrap.appendChild(canvas);

            var ctx=canvas.getContext('2d');
            return page.render({canvasContext:ctx,viewport:vp}).promise.then(function(){
              pageCanvases.push({
                canvas:canvas,
                offsetTop:canvas.offsetTop,
                pdfHeight:page.getViewport({scale:1}).height,
                renderHeight:canvas.offsetHeight
              });
            });
          });
        });
      })(p);
    }
    chain.then(function(){
      pdfReady=true;
      /* Recalculate offsets after all canvases rendered */
      for(var i=0;i<pageCanvases.length;i++){
        pageCanvases[i].offsetTop=pageCanvases[i].canvas.offsetTop;
        pageCanvases[i].renderHeight=pageCanvases[i].canvas.offsetHeight;
      }
      /* If already stepped to a row, re-sync PDF via P3 bridge */
      if(window.triggerSync) window.triggerSync();
    });
  });
};
document.head.appendChild(script);

/* Expose a global function for P3 to call */
window.syncPdfPrecise=function(idx){
  if(!pdfReady) return;
  var pcr=document.getElementById('pcr');
  var r=D.rows[idx];
  var pos=null;

  if(D.isStmt){
    var seg=D.segments[r.seg];
    if(seg.sheet==='Summary'){
      /* Summary: use summaryPdfPos with segment-relative index */
      var sPos=D.summaryPdfPos||[];
      var sumIdx=idx-seg.startIdx;
      if(sumIdx>=0 && sumIdx<sPos.length && sPos[sumIdx]) pos=sPos[sumIdx];
    } else if(seg.sheet==='Transactions'){
      /* Transactions: use pdfPos (now merged, aligned with DataFrame) */
      var posIdx=idx-seg.startIdx;
      if(D.pdfPos && posIdx>=0 && posIdx<D.pdfPos.length) pos=D.pdfPos[posIdx];
    }
  } else {
    if(D.pdfPos && idx>=0 && idx<D.pdfPos.length) pos=D.pdfPos[idx];
  }

  if(!pos) return;
  var pg=pos.pg;
  if(pg>=pageCanvases.length) return;

  var pc=pageCanvases[pg];
  var scale=pc.renderHeight/pc.pdfHeight;
  var rowTopPx=pc.offsetTop+pos.yt*scale;
  var rowHPx=(pos.yb-pos.yt)*scale;

  /* Rule 1: PDF color box height = PDF record height (independent) */
  pcr.style.height=Math.max(rowHPx,20)+'px';

  /* Rule 3: top aligned with Excel, then scroll PDF content into box */
  var exTop=parseInt(document.getElementById('ecb').style.top)||0;
  pcb.style.top=exTop+'px';
  pcb.style.display='block';
  psEl.scrollTop=rowTopPx-exTop;
};

/* Override the syncPdf in P3 to use precise positioning */
var origSyncPdf=window.syncPdf||null;
/* Patch: replace the P3 syncPdf with a version that calls syncPdfPrecise */
})();
</script>
</body></html>
